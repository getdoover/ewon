[project]
name = "ewon"
version = "0.1.0"
description = "Doover processors for fetching tag data from HMS Ewon industrial gateways"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "pydoover>=1.0.0a11",
    "ewon-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_mailbox", "src/netbiter", "src/ftp"]

[project.scripts]
export-config-dm = "data_mailbox.app_config:export"
export-config-netbiter = "netbiter.app_config:export"
export-config-ftp = "ftp.app_config:export"

[dependency-groups]
dev = [
    "boto3>=1.40.21",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
ewon-common = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
