[project]
name = "ewon"
version = "0.1.0"
description = "Doover processor for fetching tag data from HMS Ewon industrial gateways via the Talk2M DataMailbox API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "pydoover>=0.4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
export-config = "ewon.app_config:export"

[dependency-groups]
dev = [
    "boto3>=1.40.21",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
pydoover = { git = "https://github.com/getdoover/pydoover", branch = "doover-2" }
