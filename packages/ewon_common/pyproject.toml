[project]
name = "ewon-common"
version = "0.1.0"
description = "Shared code for Ewon processor packages"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.0.0a5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ewon_common"]
