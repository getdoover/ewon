name: Test, Lint & Deploy Processor

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Release on failed test or linting (not recommended!)?'
        required: true
        type: boolean

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    uses: ./.github/workflows/run-linting.yml
    secrets: inherit

  test:
    name: Test Code
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit

  validate:
    name: Validate Schemas
    uses: ./.github/workflows/validate-schema.yml
    secrets: inherit

  release:
    name: Release to Doover (${{ matrix.environment }})
    needs: [lint, test, validate]
    # Release on main (and PRs, as alpha) when the checks pass, unless a
    # workflow_dispatch explicitly overrides.
    if: ${{ (needs.test.result == 'success' && needs.validate.result == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirmation == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false # one environment failing must not block the other
      matrix:
        include:
          - environment: staging
            control_api: https://api.staging.udoover.com
          - environment: production
            control_api: https://api.doover.com
    env:
      DOOVER_CONTROL_API_BASE_URL: ${{ matrix.control_api }}
      DOOVER_OIDC_AUDIENCE: ${{ matrix.control_api }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Doover CLI
        run: uv tool install doover-cli

      # All processors in this repo ship the same package.zip (they differ only
      # by lambda handler), so build it once and reuse it for every app below.
      - name: Build the processor package
        run: ./build.sh

      - name: Publish & release each processor
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          APPS=$(python3 -c "import json; print('\n'.join(k for k, v in json.load(open('doover_config.json')).items() if isinstance(v, dict) and 'type' in v))")
          # PR builds are published as alpha so they never auto-select as "Latest".
          ALPHA=""
          if [ "$IS_PR" = "true" ]; then ALPHA="--alpha"; fi
          for app in $APPS; do
            echo "::group::publish $app"
            # Reuse the package.zip built above instead of rebuilding per app.
            doover app publish --app-name "$app" --no-build-package
            echo "::endgroup::"
            echo "::group::release $app"
            doover app release --app-name "$app" \
              --commit "$COMMIT_SHA" \
              --notes "$RELEASE_NOTES" \
              $ALPHA
            echo "::endgroup::"
          done
