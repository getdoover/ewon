name: Validate Schemas

on:
  workflow_call:

jobs:
  validate_schemas:
    name: Validate Config Schemas
    # Mirrors the release job: validate regenerates each processor's config
    # schema from the Python (via `uv run export-config-*`), which only needs
    # uv + the project resolved from PyPI.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Doover CLI
        run: uv tool install doover-cli

      # One entry per app in doover_config.json. Each processor has its own
      # export-config command, so validate per app-name. UI export is NO_EXPORT
      # for processors, so there's no ui-schema to validate.
      - name: Validate each processor's config schema
        run: |
          set -euo pipefail
          APPS=$(python3 -c "import json; print('\n'.join(k for k, v in json.load(open('doover_config.json')).items() if isinstance(v, dict) and 'type' in v))")
          for app in $APPS; do
            echo "::group::config-schema validate $app"
            doover config-schema validate --app-name "$app"
            echo "::endgroup::"
          done
