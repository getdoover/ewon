name: Run Tests

on:
  workflow_call:

jobs:
  run_tests:
    name: Run Tests
    # Plain runner (no doover_device_base): this is a cloud processor, not a
    # container app, so there are no shared image deps to resolve.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the lambda runtime the package is built for (build.sh).
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        # This might use `doover app test` in the future.
        run: uv run pytest tests
